[General]
panels=panel1

[panel1]
alignment=Left
animation-duration=0
background-color=@Invalid()
font-color=@Invalid()
hidpi-icons=false
icon-size=24
line-count=1
lock-panel=true
opacity=100
panel-size=36
position=Bottom
plugins=mainmenu,taskbar,statusnotifier,tray,clock,showdesktop

[panel1/mainmenu]
type=mainmenu
icon=/usr/share/pixmaps/sija-logo.png
text=sijaOS

[panel1/taskbar]
type=taskbar

[panel1/statusnotifier]
type=statusnotifier

[panel1/tray]
type=tray

[panel1/clock]
type=clock
format="hh:mm ddd d MMM"

[panel1/showdesktop]
type=showdesktop
