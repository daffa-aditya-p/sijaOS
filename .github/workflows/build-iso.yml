name: Build sijaOS Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build sijaOS Debian Live ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build sijaOS via Debian Bookworm Container
        run: |
          docker run --privileged --rm -v $(pwd):/workspace -w /workspace debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            echo "=== Menginstall build tools di container Debian Bookworm ==="
            apt-get update
            apt-get install -y live-build live-boot live-config debootstrap xorriso squashfs-tools xz-utils zstd curl ca-certificates

            echo "=== Membersihkan cache build lama ==="
            lb clean --purge || true

            echo "=== Menyetel perizinan script ==="
            chmod +x auto/*
            chmod +x config/includes.chroot/usr/local/bin/*
            chmod +x config/includes.chroot/etc/skel/Desktop/*.desktop

            echo "=== Konfigurasi live-build ==="
            lb config

            echo "=== Memulai Build ISO sijaOS (Kompresi XZ Maksimal) ==="
            lb build

            echo "=== Hasil Build Selesai ==="
            ls -lh *.iso
            mv *.iso sijaOS-amd64.iso
          '

      - name: Calculate Checksum (SHA256)
        run: |
          sha256sum sijaOS-amd64.iso > sijaOS-amd64.iso.sha256
          cat sijaOS-amd64.iso.sha256
          ls -lh sijaOS-amd64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sijaOS-amd64-iso
          path: sijaOS-amd64.iso
          retention-days: 7

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Mengunggah release asset menggunakan GitHub CLI..."
          gh release upload latest sijaOS-amd64.iso sijaOS-amd64.iso.sha256 --clobber --repo ${{ github.repository }} || \
          gh release create latest sijaOS-amd64.iso sijaOS-amd64.iso.sha256 \
            --title "sijaOS - Network Practice Edition (Latest)" \
            --notes "## 🚀 sijaOS Live ISO (Network Practice Edition)
          OS ringan berbasis **Debian 12 (Bookworm)** yang dirancang khusus untuk client praktek jaringan komputer & MikroTik di Oracle VM VirtualBox.
          - **Desktop**: LXQt (Sangat ringan, konsumsi RAM idle hanya ~200 MB)
          - **Offline Ready**: Winbox sudah tertanam di dalam ISO, langsung buka tanpa internet
          - **Lengkap**: Wireshark, Nmap, PuTTY, FileZilla, Geany, MAC-Telnet, Net-tools, Firefox
          - **Multi-Device**: Mendukung semua prosesor 64-bit Intel & AMD serta VirtualBox" \
            --repo ${{ github.repository }}
